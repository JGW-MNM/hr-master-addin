<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Master</title>
  <!-- Office.js: jembatan antara halaman ini dan Excel -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --navy: #1f3864; --navy-2: #2e4a7d; --ink: #1d2433; --muted: #5f6b7d; --line: #dfe3ea;
      --bg: #f6f7f9; --card: #ffffff; --input: #fffbea; --ok: #1e7b45; --ok-bg: #e7f5ec;
      --err: #b42318; --err-bg: #fdecea; --warn: #8a5300; --warn-bg: #fff4dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 12px 14px 0; position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
    .badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.16); white-space: nowrap; }
    .badge.demo { background: #f2c94c; color: #3d2c00; }
    nav { display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; margin-top: 10px; }
    nav button { border: 0; background: transparent; color: #c9d3e6; padding: 8px 2px; font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent; }
    nav button.on { color: #fff; border-bottom-color: #f2c94c; font-weight: 600; }
    main { padding: 14px; }
    h2 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 12px; margin: 10px 0 4px; }
    label .opt { font-weight: 400; color: var(--muted); }
    input, textarea { width: 100%; padding: 7px 9px; border: 1px solid #c8ced8; border-radius: 6px; font: inherit; background: var(--input); color: var(--ink); }
    input:focus, textarea:focus { outline: 2px solid #8fb0e8; border-color: var(--navy-2); }
    textarea { resize: vertical; min-height: 44px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .peek { margin-top: 5px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .peek b { color: var(--ink); font-weight: 600; }
    .peek.bad { color: var(--err); font-weight: 600; }
    .peek.flag { color: var(--warn); }
    .bad { color: var(--err); font-weight: 600; }
    .flag { color: var(--warn); }
    .kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 8px; font-size: 12px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; word-break: break-word; }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .pill.on { background: var(--ok-bg); color: var(--ok); } .pill.off { background: #eceef2; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 6px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
    .btn.primary { background: var(--navy); color: #fff; width: 100%; margin-top: 14px; }
    .btn.primary:hover { background: var(--navy-2); }
    .btn.primary:disabled { opacity: .55; cursor: wait; }
    .btn.ghost { background: #e9edf4; color: var(--navy); padding: 6px 10px; font-size: 12px; }
    .alert { border-radius: 6px; padding: 9px 11px; margin-top: 12px; font-size: 12.5px; }
    .alert ul { margin: 4px 0 0 16px; padding: 0; }
    .alert.err { background: var(--err-bg); color: var(--err); }
    .alert.ok { background: var(--ok-bg); color: var(--ok); }
    .alert.warn { background: var(--warn-bg); color: var(--warn); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .kpi .n { font-size: 20px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
    .kpi .l { font-size: 11px; color: var(--muted); }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 12px; }
    .list li:first-child { border-top: 0; }
    .list .meta { color: var(--muted); font-size: 11px; }
    .subs li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .btn { width: 100%; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>HR Master · SSOT</h1><span id="mode" class="badge">…</span></div>
    <nav id="nav">
      <button data-view="home">Home</button>
      <button data-view="onboarding" title="Onboarding">Onboard</button>
      <button data-view="changeOrg" title="Change Organization">Org</button>
      <button data-view="changeReport" title="Change Direct Report">Atasan</button>
      <button data-view="offboarding" title="Offboarding">Offboard</button>
    </nav>
  </header>
  <main id="app"><div class="loading">Memuat data…</div></main>

  <datalist id="dl-emp"></datalist>
  <datalist id="dl-emp-active"></datalist>
  <datalist id="dl-dept"></datalist>
  <datalist id="dl-job"></datalist>

  <script src="core.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
